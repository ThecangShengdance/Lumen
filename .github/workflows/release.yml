name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          chmod +x scripts/build.sh scripts/package.sh
          ./scripts/package.sh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 dist/Lumen-1.0.2.zip --clobber
          else
            gh release create v1.0.2 dist/Lumen-1.0.2.zip \
              --title "Lumen 1.0.2" \
              --notes-file .github/release-notes-1.0.2.md \
              --latest
          fi
